<tars>
    <application>
        <client>
            locator=
            modulename=CaiRobotGatewayApp
        </client>
        <server>
            app=CaiRobot
            server=GatewayServer
            local=tcp -h 127.0.0.1 -p 13014 -t 30000
            logpath=/tmp/cairobot/logs/gateway
            loglevel=DEBUG
            logsize=10485760
            lognum=10
            <CaiRobot.GatewayServer.GatewayHttpObjAdapter>
                allow
                endpoint=tcp -h 0.0.0.0 -p 8080 -t 60000
                handlegroup=CaiRobot.GatewayServer.GatewayHttpObjAdapter
                maxconns=200000
                protocol=no_tars
                queuecap=10000
                queuetimeout=60000
                servant=CaiRobot.GatewayServer.GatewayHttpObj
                shmcap=0
                shmkey=0
                threads=1
            </CaiRobot.GatewayServer.GatewayHttpObjAdapter>
        </server>
    </application>
</tars>
