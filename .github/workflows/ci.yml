name: CaiRobot MVP CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "test/**"

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: python3 scripts/ci/check_required_docs.py

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check proto registry
        run: python3 scripts/ci/check_proto_registry.py

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run Go tests
        run: |
          if [ -f services/hello-go/go.mod ]; then
            cd services/hello-go
            go test ./...
          else
            echo "跳过 go-test：services/hello-go/go.mod 不存在，当前尚未实现 Golang HelloWorld 骨架。"
          fi

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        run: |
          if [ -f ai/service/pyproject.toml ] || [ -f ai/service/requirements.txt ]; then
            cd ai/service
            python -m pytest
          else
            echo "跳过 python-test：ai/service 暂无 pyproject.toml 或 requirements.txt。"
          fi

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Web App tests
        run: |
          if [ -f web/app/package.json ]; then
            cd web/app
            npm ci
            npm test -- --runInBand
          else
            echo "跳过 web-test：web/app/package.json 不存在，当前尚未实现 ReactJS App 骨架。"
          fi

  admin-web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Admin Web tests
        run: |
          if [ -f web/provider-admin/package.json ]; then
            cd web/provider-admin
            npm ci
            npm test -- --runInBand
          else
            echo "跳过 admin-web-test：web/provider-admin/package.json 不存在，当前尚未实现 AdminWeb 骨架。"
          fi

  report-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reports
        run: python3 scripts/ci/check_reports.py
