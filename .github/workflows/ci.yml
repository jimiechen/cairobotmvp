name: CaiRobot MVP CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "test/**"

jobs:
  ci-full:
    name: 完整 CI 检查（通过 make ci 编排）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 bash

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行完整 CI 检查
        run: make ci
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-check:
    name: 文档检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [ci-full]
    steps:
      - uses: actions/checkout@v4
      - name: 检查文档完整性
        run: python3 scripts/ci/check_required_docs.py

  proto-check:
    name: 协议检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [ci-full]
    steps:
      - uses: actions/checkout@v4
      - name: 检查协议编号注册表
        run: python3 scripts/ci/check_proto_registry.py
      - name: 检查生成代码是否已提交
        run: bash scripts/proto/check-generated-clean.sh || echo "跳过：首次提交或无生成代码"

  report-check:
    name: 报告检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [ci-full]
    steps:
      - uses: actions/checkout@v4
      - name: 检查报告完整性
        run: python3 scripts/ci/check_reports.py
