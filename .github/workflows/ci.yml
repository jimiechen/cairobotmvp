name: CaiRobot MVP CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "test/**"

jobs:
  ci-full:
    name: 完整 CI 检查（通过 make ci 编排）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 bash

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行完整 CI 检查
        run: make ci
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-check:
    name: 文档检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [ci-full]
    steps:
      - uses: actions/checkout@v4
      - name: 检查文档完整性
        run: python3 scripts/ci/check_required_docs.py

  proto-check:
    name: 协议检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [ci-full]
    steps:
      - uses: actions/checkout@v4
      - name: 检查协议编号和生成代码
        run: python3 scripts/ci/check_proto_registry.py

  report-check:
    name: 报告检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [ci-full]
    steps:
      - uses: actions/checkout@v4
      - name: 检查报告完整性
        run: python3 scripts/ci/check_reports.py

  module-lint:
    name: 模块合规性 Lint（合入硬门槛）
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [ci-full]
    steps:
      - uses: actions/checkout@v4
      - name: 执行模块 lint 检查（10+1 项强制检查）
        run: bash scripts/lint/module_lint.sh
      - name: 检查 hello 模块
        run: bash scripts/lint/module_lint.sh --module hello
      - name: 检查 health 模块
        run: bash scripts/lint/module_lint.sh --module health
