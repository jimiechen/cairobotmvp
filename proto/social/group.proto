syntax = "proto3";
option objc_class_prefix = "PROTO";
import "base/result.proto";
import "base/common.proto";
import "social/member.proto";
import "social/topic.proto";

package com.mineplanet.pojo.group;
option java_outer_classname = "GroupListServiceProto";
option go_package = "github.com/jimiechen/mineplanet/protocols/generated/go/social";
option optimize_for = LITE_RUNTIME;

// 成员排序字段枚举
enum MemberSortBy {
  MEMBER_SORT_BY_UNKNOWN = 0;       // 默认，按角色权重+加入时间
  MEMBER_SORT_BY_JOINED_AT = 1;     // 按加入时间
  MEMBER_SORT_BY_EXPIRES_AT = 2;    // 按到期时间
}

// 群组状态枚举
enum GroupStatus {
  GROUP_STATUS_UNKNOWN = 0;    // 未知状态
  GROUP_STATUS_ACTIVE = 1;     // 活跃状态
  GROUP_STATUS_INACTIVE = 2;   // 非活跃状态
  GROUP_STATUS_SUSPENDED = 3;  // 暂停状态
  GROUP_STATUS_DELETED = 4;    // 已删除状态
}

// 群组可见性枚举
enum GroupVisibility {
  GROUP_VISIBILITY_UNKNOWN = 0; // 未知
  GROUP_VISIBILITY_PUBLIC = 1;  // 公开
  GROUP_VISIBILITY_PRIVATE = 2; // 私有
  GROUP_VISIBILITY_SECRET = 3;  // 秘密
}

// 加入方式枚举
enum JoinMode {
  JOIN_MODE_UNKNOWN = 0;       // 未知方式
  JOIN_MODE_OPEN = 1;          // 开放加入
  JOIN_MODE_APPROVAL = 2;      // 需要审批
  JOIN_MODE_INVITE_ONLY = 3;   // 仅邀请
  JOIN_MODE_PAID_OPEN = 4;     // 付费公开加入
}

// 付费周期单位（用于圈子付费配置）
enum PayCycleUnit {
  PAY_CYCLE_UNIT_UNKNOWN = 0;  // 未知
  PAY_CYCLE_UNIT_MONTH = 1;    // 月
  PAY_CYCLE_UNIT_QUARTER = 2;  // 季度
  PAY_CYCLE_UNIT_HALF_YEAR = 3;// 半年
  PAY_CYCLE_UNIT_YEAR = 4;     // 年
}

// 问题限制枚举
enum QuestionLimit {
  QUESTION_LIMIT_UNKNOWN = 0;           // 未知
  QUESTION_LIMIT_UNLIMITED = 1;         // 无限制
  QUESTION_LIMIT_30_PER_MONTH = 2;      // 每月30个问题
  QUESTION_LIMIT_25_PER_MONTH = 3;      // 每月25个问题
  QUESTION_LIMIT_20_PER_MONTH = 4;      // 每月20个问题
  QUESTION_LIMIT_15_PER_MONTH = 5;      // 每月15个问题
  QUESTION_LIMIT_10_PER_MONTH = 6;      // 每月10个问题
  QUESTION_LIMIT_5_PER_MONTH = 7;       // 每月5个问题
}

// 发帖权限枚举
enum WhoCanPost {
  WHO_CAN_POST_UNKNOWN = 0;             // 未知
  WHO_CAN_POST_EVERYONE = 1;            // 所有人
  WHO_CAN_POST_CREATOR_ONLY = 2;        // 仅创建者
  WHO_CAN_POST_ADMINS_AND_CONTRIBUTORS = 3; // 管理员和贡献者
}

// 圈子付费配置（创建/更新时作为扩展参数传入）
message GroupPayConfig {
  PayCycleUnit cycle_unit = 1; // 付费周期单位（天/周/月/年）
  double amount = 2;           // 金额（数值类型，单位为币种最小计量）
  string currency = 3;         // 币种（ISO 4217，如 CNY/USD/EUR）
}

// 圈子统计信息
message GroupStats {
  int32 members_count = 1;     // 成员数量
  int32 topics_count = 2;      // 话题数量
  int32 comments_count = 3;    // 评论数量
  int32 likes_count = 5;       // 点赞数量
  int64 last_activity_at = 7;  // 最后活跃时间

  // v3.0 新增：groups 表状态字段
  int64 group_updated_at = 8;       // 圈子强制更新时间
  GroupStatus status = 9; // 圈子生命周期状态
  GroupVisibility visibility = 10;        // 可见性

  reserved 4, 6;
}

// 用户成员信息
message UserMemberInfo {
  string user_id = 1;          // 用户ID
  com.mineplanet.pojo.user.GroupMemberRole role = 2;  // 角色
  MemberStatus status = 3;     // 状态
  int64 joined_at = 4;         // 加入时间
  int64 last_activity_at = 5;  // 最后活跃时间
  repeated string permissions = 6; // 权限列表

  // 发帖权限（用于控制发帖页面显示哪些选项）
  bool can_create_normal = 7;            // 是否允许发常规帖子
  bool can_create_article = 8;           // 是否允许发文章
  bool can_create_question = 9;          // 是否允许提问

  // 提问配额信息（实时计算）
  int32 question_quota_total = 10;       // 提问配额总数
  int32 question_quota_used = 11;        // 本月已用提问次数
  int32 question_quota_remaining = 12;   // 剩余提问次数
  int64 question_quota_reset_at = 13;    // 配额重置时间戳

  // 新增：会员到期信息（2026-05-16）
  int64 membership_expires_at = 14;      // 会员到期时间戳（秒级）
  bool membership_expiry_reminder = 15;  // 是否已触发到期提醒（true=已提醒）
}

// 圈子信息
message GroupInfo {
  string group_id = 1;               // 圈子ID
  string name = 2;             // 圈子名称
  string slug = 3;             // 圈子标识符
  string description = 4;      // 圈子描述
  string avatar = 5;           // 头像URL
  string cover_image = 6;      // 封面图片URL
  string category = 7;         // 圈子分类
  repeated string tags = 8;    // 标签列表
  string owner_id = 9;         // 创建者ID
  GroupStatus status = 10;     // 状态
  GroupVisibility visibility = 11; // 可见性
  JoinMode join_mode = 12;     // 加入方式
  bool is_official = 13;       // 是否官方
  bool is_featured = 14;       // 是否精选
  int32 max_members = 15;      // 最大成员数
  // reserved: 移除不再使用的字段以避免误复用
  reserved 16, 17, 18, 19, 20;
  int64 created_at = 21;       // 创建时间
  int64 updated_at = 22;       // 更新时间
  reserved 23, 24, 25;           // v3.0 已迁移: stats(23)/user_member_info(24)/extra(25) 移至独立响应或按需查询
}

message OwnerProfile {
  string owner_name = 1;       // 圈主展示名，用于列表/Recent Posts抬头
  string owner_avatar = 2;     // 圈主头像（/.figma/image 路径）
}

message LatestTopicPreview {
  string topic_id = 1;         // 最新帖子ID
  string summary = 2;          // 最新帖子摘要（截断）
  com.mineplanet.pojo.topic.MediaType media_label = 3;   // 媒体标签
  string thumbnail_url = 4;    // 预览缩略图（/.figma/image 路径）
  int32 duration_sec = 5;      // 媒体时长（秒），客户端渲染文本
}




// 统一的成员信息消息（合并 GroupMember 和 GroupMemberView）
message MemberInfo {
  string member_id = 1;                 // 成员记录ID
  string group_id = 2;                  // 圈子ID
  string user_id = 3;                   // 用户ID
  com.mineplanet.pojo.user.GroupMemberRole role = 4;   // 角色
  MemberStatus status = 5;              // 状态
  string join_reason = 6;               // 加入原因
  string invited_by = 7;                // 邀请人ID
  int64 joined_at = 8;                  // 加入时间
  int64 last_activity_at = 9;           // 最后活跃时间
  string bio = 10;                      // 成员简介
  int32 answered_questions_count = 11;  // 已回答问题数
  int32 remaining_quota = 12;           // 可提问数
  PayCycleUnit payment_cycle = 13;      // 付费周期
  int64 membership_expires_at = 14;     // 会员到期时间
  int64 muted_until = 15;               // 禁言到期时间
  int64 ban_expires_at = 16;            // 封禁到期时间
  string approved_by = 17;              // 审批人ID
  string banned_by = 18;                // 封禁人ID
  string ban_reason = 19;               // 封禁理由
  string nickname = 20;                 // 用户昵称（来自 users 表）
  string uid = 21;                      // 用户UID（来自 users 表）

  // 新增：拉黑时间戳（秒），取执行 BanMember 操作时的 updated_at
  int64 banned_at = 22;
}

// 圈子邀请信息
message GroupInvitation {
  string invitation_id = 1;               // 邀请ID
  string group_id = 2;         // 圈子ID
  string inviter_id = 3;       // 邀请人ID
  string invitee_id = 4;       // 被邀请人ID
  string email = 5;            // 邮箱
  string phone = 6;            // 手机号
  string code = 7;             // 邀请码
  string message = 8;          // 邀请消息
  InvitationStatus status = 9; // 状态
  int64 expires_at = 10;       // 过期时间
  int64 accepted_at = 11;      // 接受时间
  int64 created_at = 12;       // 创建时间
  com.mineplanet.pojo.common.UserInfo inviter_info = 13;  // 邀请人信息
  GroupInfo group_info = 14;   // 圈子信息
}




// 接口用途：获取圈子统计
message GetGroupStatsRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2039;
  }
  string group_id = 1;         // 圈子ID
}

// 接口用途：返回圈子统计结果
message GetGroupStatsResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2040;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 错误与状态（code/message）
  GroupStats stats = 2;                         // 统计信息
  string group_id = 3;                      // 新增：透传 group_id
}

// 接口用途：批量获取圈子信息
message BatchGetGroupsRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2047;
  }
  repeated string group_ids = 1; // 圈子ID集合，长度建议 ≤ 100
  bool include_stats = 2;        // 是否返回统计信息（默认 false）
}

// 接口用途：批量获取圈子信息响应
message BatchGetGroupsResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2048;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 错误与状态（code/message）
  repeated GroupInfo groups = 2;            // 圈子信息列表
  repeated GroupStats stats = 3;            // 统计信息列表（当 include_stats=true 时返回）
  repeated string group_ids = 4;            // 新增：透传 group_ids
}





// 接口用途：检查圈子名称可用性
message CheckGroupNameAvailabilityRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2051;
  }
  string name = 1;             // 非必填，圈子名称
}

// 接口用途：返回圈子名称可用性检查结果
message CheckGroupNameAvailabilityResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2052;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  bool available = 2;        // 可用性
  string reason = 3;         // 不可用原因
  string normalized = 4;     // 规范化名称
  string name = 5;           // 新增：透传 name
}

// 接口用途：刷新圈子实时状态（支持增量与批量圈子ID过滤）
message RefreshGroupStatRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2041;
  }
  repeated string group_ids = 1; // 非必填，圈子ID列表（目标圈子集合）
  int64 since_ts = 2;            // 非必填，增量起始时间戳
}


// 接口用途：创建圈子（含可选付费配置）
message CreateGroupRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2005;
  }
  string name = 1;             // 必填，圈子名称
  string slug = 2;             // 必填，圈子标识符
  string description = 3;      // 必填，圈子描述
  string category = 4;         // 必填，圈子分类
  JoinMode join_mode = 5;      // 必填，加入方式
  string cover_image = 6;      // 非必填，封面图片 URL
  // 新增：圈子付费配置（多周期，至少一项）
  repeated GroupPayConfig pay_configs = 7; // 非必填，圈子付费配置
}

// 接口用途：返回已创建圈子信息
message CreateGroupResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2006;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  reserved 2; // 移除 group_id，统一从 group_info.id 获取
  GroupInfo group_info = 3;    // 圈子信息
  // 新增：回传创建时的付费配置，便于前端立即渲染
  repeated GroupPayConfig pay_configs = 4; // 非必填，圈子付费配置
  string group_id = 5;         // 新增：顶层暴露 group_id
}


// 接口用途：更新圈子基本信息
message UpdateGroupRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2009;
  }
  string group_id = 1;         // 非必填，圈子ID
  string cover_image = 2;      // 非必填，封面图片 URL
  string name = 3;             // 非必填，圈子名称
  string slug = 4;             // 非必填，圈子标识符
  string description = 5;      // 非必填，圈子描述
  repeated string update_mask = 99; // 非必填，更新字段列表（支持：name、slug、description、cover_image）
}

// 接口用途：返回更新后的圈子信息
message UpdateGroupResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2010;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  GroupInfo group_info = 2;    // 更新后的圈子信息
  string group_id = 3;         // 新增：顶层暴露 group_id
}

// 接口用途：解散圈子
message DeleteGroupRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2011;
  }
  string group_id = 1;         // 非必填，圈子ID
}

// 接口用途：返回解散结果
message DeleteGroupResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2012;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  string group_id = 2;         // 新增：顶层暴露 group_id
}


// 接口用途：申请加入圈子
message JoinGroupRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2013;
  }
  string group_id = 1;         // 非必填，圈子ID
  string join_reason = 3;      // 非必填，加入原因
  string invitation_code = 4;  // 非必填，邀请码
}

// 接口用途：返回入圈结果
message JoinGroupResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2014;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  string member_id = 2;        // 成员ID
  JoinStatus status = 3;       // 状态
  string message = 4;          // 消息
  string group_id = 5;         // 新增：顶层暴露 group_id
}


// 接口用途：退出圈子
message LeaveGroupRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2015;
  }
  string group_id = 1;         // 非必填，圈子ID
}

// 接口用途：返回退出结果
message LeaveGroupResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2016;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  string group_id = 2;         // 新增：顶层暴露 group_id
}




// 接口用途：分页查询成员 UserID 列表
message GetGroupMemberUserIdsRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2077;
  }
  string group_id = 1;                    // 必填，圈子ID
  MemberSortBy sort_by = 2;               // 非必填，排序字段
  com.mineplanet.pojo.common.SortOrder sort_order = 3;  // 非必填，排序方向
  int32 page = 4;                         // 非必填，页码（默认1）
  int32 page_size = 5;                    // 非必填，每页大小（默认20，最大100）
}

// 接口用途：返回成员 UserID 列表
message GetGroupMemberUserIdsResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2078;
  }
  com.mineplanet.pojo.pb.Result result = 1;
  repeated string user_ids = 2;           // 用户ID列表
  int32 total = 3;                        // 总数
  int32 page = 4;                         // 页码
  int32 page_size = 5;                    // 每页大小
  string group_id = 6;                    // 透传圈子ID
}

// 接口用途：批量查询 MemberInfo 详情
message GetMemberInfosRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2079;
  }
  string group_id = 1;                    // 必填，圈子ID
  repeated string user_ids = 2;           // 必填，用户ID数组（最多50个）
}

// 接口用途：返回 MemberInfo 列表
message GetMemberInfosResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2080;
  }
  com.mineplanet.pojo.pb.Result result = 1;
  repeated MemberInfo members = 2;        // 成员详情列表（含 nickname、uid）
  string group_id = 3;                    // 透传圈子ID
}

// 接口用途：搜索成员（按 Nickname / UID）
message SearchGroupMembersRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2091;
  }
  string group_id = 1;                    // 必填，圈子ID
  string keyword = 2;                     // 必填，搜索关键词（匹配 nickname 或 uid）
}

// 接口用途：返回搜索结果（不分页）
message SearchGroupMembersResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2092;
  }
  com.mineplanet.pojo.pb.Result result = 1;
  repeated MemberInfo members = 2;        // 搜索结果列表（不分页）
  string group_id = 3;                    // 透传圈子ID
  string keyword = 4;                     // 透传关键词
}

// 接口用途：批量获取指定用户在圈子的角色映射
message GetMemberRolesRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2043;
  }
  string group_id = 1;         // 非必填，圈子ID
  repeated string uids = 2;    // 非必填，用户UID列表
}

// 用户角色映射
message MemberRoleMapping {
  string uid = 1;                                    // 用户UID
  com.mineplanet.pojo.user.GroupMemberRole role = 2; // 角色枚举
}

// 接口用途：返回用户角色映射结果
message GetMemberRolesResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2044;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  repeated MemberRoleMapping roles = 2; // 角色映射列表
  string group_id = 3;                  // 新增：透传 group_id
}

// 接口用途：通过member_id数组批量获取圈子成员的角色映射（group_id已注销，兼容旧版客户端）
message GetMemberRolesByMemberIdsRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2045;
  }
  reserved 1;                               // 注销旧版 group_id 字段（传了忽略，不报错）
  repeated string member_ids = 2;           // 必填，成员ID列表（group_members.id），自动反查所属圈子
}

// 成员角色映射（按member_id查询）
message MemberRoleMappingByMemberId {
  string member_id = 1;                              // 成员ID（group_members.id）
  string uid = 2;                                    // 用户UID
  com.mineplanet.pojo.user.GroupMemberRole role = 3; // 角色枚举
  string group_id = 4;                               // 所属圈子ID
}

// 接口用途：返回批量member_id查询的角色映射结果
message GetMemberRolesByMemberIdsResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2046;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  repeated MemberRoleMappingByMemberId roles = 2; // 角色映射列表（每个包含group_id）
}


// 接口用途：检查圈子短ID（slug）可用性
message CheckGroupSlugAvailabilityRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2053;
  }
  string slug = 1;             // 非必填，圈子短ID
}

// 接口用途：返回圈子短ID（slug）可用性检查结果
message CheckGroupSlugAvailabilityResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2054;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 标准结果
  bool available = 2;        // 可用性
  string reason = 3;         // 不可用原因
  string slug = 4;           // 新增：透传 slug
}


// 禁言时长枚举
enum MuteDuration {
  MUTE_DURATION_UNKNOWN = 0;
  MUTE_DURATION_1_HOUR = 1;
  MUTE_DURATION_4_HOURS = 2;
  MUTE_DURATION_12_HOURS = 3;
  MUTE_DURATION_1_DAY = 4;
  MUTE_DURATION_7_DAYS = 5;
}

// 接口用途：禁言指定成员
message MuteMemberRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2019;
  }
  string group_id = 1;               // 非必填，圈子ID
  string user_id = 2;                // 非必填，用户ID
  reserved 3;                        // 原 muted_until 已废弃，使用 mute_duration
  string mute_reason = 4;            // 非必填，禁言理由
  MuteDuration mute_duration = 5;    // 必填，禁言时长枚举
}

// 接口用途：返回禁言操作结果
message MuteMemberResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2020;
