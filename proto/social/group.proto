  DiscountType discount_type = 1; // 必填，折扣类型
  double discount_rate = 2;       // 必填，折扣比例，如 0.8 表示 8 折
  int64 start_time = 3;           // 必填，生效开始时间，Unix 秒，UTC
  int64 end_time = 4;             // 必填，生效结束时间，Unix 秒，UTC
  bool enabled = 5;               // 必填，是否启用
}

