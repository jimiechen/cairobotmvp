// 接口用途：高级设置快速修改（支持 advanced_settings 中的配置项 + pay_configs 付费配置）
// 使用示例：
//   1. 开关型: { "group_id": "xxx", "setting_key": "planet_updates", "setting_value": "1" }
//   2. 问题限制: { "group_id": "xxx", "setting_key": "question_limit", "question_limit": 2 }  (使用枚举字段，数值2=每月30个)
//   3. 发帖权限: { "group_id": "xxx", "setting_key": "who_can_post", "who_can_post": 1 }  (使用枚举字段，数值1=所有人)
//   4. 付费配置: { "group_id": "xxx", "setting_key": "pay_configs", "pay_configs": [{"cycle_unit": 3, "amount": 9.99, "currency": "USD"}] }
// 注意：开关型字段客户端传"0"或"1"到setting_value；枚举类型使用独立的枚举字段（question_limit/who_can_post）
message QuickUpdateSettingRequest {
  enum Type {
    none = 0;
    max = 2000;
    min = 2057;  // QuickUpdateSetting 请求
  }
  string group_id = 1;                        // 圈子ID（必填）
  // operator_id 从 extend.token 解析获取，不在请求体中明文传递
  string setting_key = 2;                     // 设置项key："planet_updates"|"disable_content_copying"|"watermark_enabled"|"who_can_post"|"question_limit"|"pay_configs"
  string setting_value = 3;                   // 设置值：开关型传"0"|"1"（用于bool类型设置项）
  repeated GroupPayConfig pay_configs = 4;   // 付费配置列表（当 setting_key="pay_configs" 时使用，包含多个订阅计划）
  QuestionLimit question_limit = 5;           // 问题限制枚举（当 setting_key="question_limit" 时使用，数值范围0-7）
  WhoCanPost who_can_post = 6;               // 发帖权限枚举（当 setting_key="who_can_post" 时使用，数值范围0-3）
}

// 接口用途：高级设置快速修改响应
message QuickUpdateSettingResponse {
  enum Type {
    none = 0;
    max = 2000;
    min = 2058;  // QuickUpdateSetting 响应
  }
  com.mineplanet.pojo.pb.Result result = 1;
  string setting_key = 2;     // 设置项key（透传）
  string new_value = 3;       // 修改后的值
  bool was_changed = 4;       // 是否实际发生了变更
}
