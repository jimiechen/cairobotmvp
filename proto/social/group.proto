enum DiscountType {
  DISCOUNT_TYPE_UNKNOWN = 0;
  DISCOUNT_TYPE_JOIN = 1;
  DISCOUNT_TYPE_RENEW = 2;
}

// 成员状态枚举
enum MemberStatus {
  MEMBER_STATUS_UNKNOWN = 0;   // 未知状态
  MEMBER_STATUS_ACTIVE = 1;    // 活跃状态
  MEMBER_STATUS_BANNED = 2;    // 封禁状态
  MEMBER_STATUS_PENDING = 3;   // 待审核状态
}

// 邀请状态枚举
enum InvitationStatus {
  INVITATION_STATUS_UNKNOWN = 0;   // 未知状态
  INVITATION_STATUS_PENDING = 1;   // 待处理
  INVITATION_STATUS_ACCEPTED = 2;  // 已接受
  INVITATION_STATUS_REJECTED = 3;  // 已拒绝
  INVITATION_STATUS_EXPIRED = 4;   // 已过期
}

// 申请状态枚举
enum ApplicationStatus {
  APPLICATION_STATUS_UNKNOWN = 0;    // 未知状态
  APPLICATION_STATUS_PENDING = 1;    // 待审核
  APPLICATION_STATUS_APPROVED = 2;   // 已通过
  APPLICATION_STATUS_REJECTED = 3;   // 已拒绝
}

