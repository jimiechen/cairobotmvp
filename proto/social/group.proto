enum JoinStatus {
  JOIN_STATUS_UNKNOWN = 0;    // 未知
  JOIN_STATUS_JOINED = 1;     // 已加入
  JOIN_STATUS_PENDING = 2;    // 待审核
  JOIN_STATUS_REJECTED = 3;   // 已拒绝
}

// 折扣项（统一数据结构：读、写、算均使用此单元）
