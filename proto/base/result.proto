syntax = "proto3";

option objc_class_prefix = "PROTO";

package com.mineplanet.pojo.pb;

option java_package = "com.mineplanet.pojo";
option java_outer_classname = "ResultProto";
option go_package = "github.com/jimiechen/mineplanet/protocols/generated/go/proto/base";
option optimize_for = LITE_RUNTIME;

// 通用返回结果
message Result {
  int32 code = 1;         // 响应码，成功建议使用 10200
  string message = 2;     // 响应消息
}

// 分页信息
message PageInfo {
  int32 pageSize = 1;     // 每页大小
  int32 pageToken = 2;    // 分页令牌
  int32 totalCount = 3;   // 总数
  string nextPageToken = 4; // 下一页令牌
}

// 错误详情
message ErrorDetail {
  string field = 1;       // 字段名
  string message = 2;     // 错误消息
  string code = 3;        // 错误码
}

// 参数校验结果
message ValidationResult {
  repeated ErrorDetail errors = 1; // 错误列表
}
