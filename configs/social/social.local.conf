# 社交域本地开发配置
# 使用方式：复制本文件为 social.conf 并修改实际值

social:
  db:
    dsn: "root:devpass@tcp(127.0.0.1:3306)/cairobot_social?charset=utf8mb4&parseTime=True&loc=Local"
    max_open_conns: 50
    max_idle_conns: 10
    conn_max_lifetime: 3600 # 秒

  redis:
    addr: "127.0.0.1:6379"
    db: 2           # 社交域使用 Redis DB 2（避免与其他域冲突）
    pool_size: 100
    min_idle_conns: 10

  plaza:
    group_id: "plaza_global_001"  # 广场虚拟成员群组 ID（固定值）

  jwt:
    secret: "${SOCIAL_JWT_SECRET:-dev-secret-change-in-production}"
    access_token_ttl: 7200      # 访问令牌有效期（秒），2小时
    refresh_token_ttl: 604800   # 刷新令牌有效期（秒），7天

  cache:
    default_ttl: 3600           # 默认缓存 TTL（秒）
    stats_ttl: 300              # 统计数据缓存 TTL（秒）
    permissions_ttl: 600        # 权限缓存 TTL（秒）

  membership:
    free_group_max_members: 500     # 免费群组最大成员数
    paid_group_max_members: 2000    # 付费群组最大成员数

  rate_limit:
    create_topic_per_hour: 10       # 每小时发帖上限
    create_reply_per_minute: 20     # 每分钟评论上限
    join_group_per_day: 10         # 每日加圈上限
