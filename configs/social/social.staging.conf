# 社交域预发布环境配置
social:
  db:
    dsn: "${SOCIAL_DB_DSN}"
    max_open_conns: 100
    max_idle_conns: 25
    conn_max_lifetime: 1800

  redis:
    addr: "${SOCIAL_REDIS_ADDR}"
    db: 2
    pool_size: 200
    min_idle_conns: 25

  plaza:
    group_id: "plaza_global_001"

  jwt:
    secret: "${SOCIAL_JWT_SECRET}"
    access_token_ttl: 7200
    refresh_token_ttl: 604800

  cache:
    default_ttl: 3600
    stats_ttl: 300
    permissions_ttl: 600

  membership:
    free_group_max_members: 500
    paid_group_max_members: 2000

  rate_limit:
    create_topic_per_hour: 30
    create_reply_per_minute: 60
    join_group_per_day: 20
