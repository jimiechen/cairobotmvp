}

// 接口用途：Inbox 服务健康检查
message InboxHealthCheckRequest {
  //Type枚举递增
  enum Type {
    none = 0;
    max = 5000;
    min = 5047;
  }
  string service_name = 1;      // 非必填，服务名称
}

// 接口用途：返回服务健康信息
message InboxHealthCheckResponse {
  //Type枚举递增
  enum Type {
    none = 0;
    max = 5000;
    min = 5048;
  }
  com.mineplanet.pojo.pb.Result result = 1;

  string status = 2;            // 健康状态
  string version = 3;           // 服务版本
  int64 uptime = 4;             // 运行时间
  map<string, string> details = 5; // 详细信息
}

// 接口用途：Hello 测试（回显）
message InboxHelloTestRequest {
  //Type枚举递增
  enum Type {
    none = 0;
    max = 5000;
    min = 5049;
  }
  string message = 1;           // 非必填，测试消息
}

// 接口用途：返回 Hello 测试结果
message InboxHelloTestResponse {
  //Type枚举递增
  enum Type {
    none = 0;
    max = 5000;
    min = 5050;
  }
  com.mineplanet.pojo.pb.Result result = 1;

  string response = 2;          // 响应消息
  int64 timestamp = 3;          // 时间戳
}