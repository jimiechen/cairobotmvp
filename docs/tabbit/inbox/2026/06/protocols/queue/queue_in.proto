// 接口用途：获取死信队列
message InboxGetDeadLetterQueueRequest {
  //Type枚举递增
  enum Type {
    none = 0;
    max = 5000;
    min = 5045;
  }
  string consumer_group = 1;    // 非必填，消费者组
  int32 page = 2;               // 非必填，页码
  int32 page_size = 3;          // 非必填，页大小
}

// 接口用途：返回死信队列分页结果
message InboxGetDeadLetterQueueResponse {
  //Type枚举递增
  enum Type {
    none = 0;
    max = 5000;
    min = 5046;
  }
  com.mineplanet.pojo.pb.Result result = 1;

  repeated InboxDeadLetter dead_letters = 2; // 死信列表
