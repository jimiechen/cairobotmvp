// ==================== 圈子订单查询 (4231/4232) ====================
// 订单相关类型定义（从 group_base 迁移至此模块）

// 订单类型枚举（用于区分首次订阅和续费）
enum OrderType {
  ORDER_TYPE_UNKNOWN = 0;           // 未知类型
  ORDER_TYPE_NEW_SUBSCRIPTION = 1;  // 新订阅（首次入圈）
  ORDER_TYPE_RENEWAL = 2;           // 续费（延长会员期）
}

// 订单状态枚举（与数据库 orders 表 status 字段保持一致）
enum OrderStatus {
  ORDER_STATUS_UNKNOWN = 0;     // 未知状态
  ORDER_STATUS_PENDING = 1;     // 待支付
  ORDER_STATUS_PAID = 2;        // 已支付
  ORDER_STATUS_CANCELLED = 3;   // 已取消
  ORDER_STATUS_REFUNDED = 4;    // 已退款
  ORDER_STATUS_EXPIRED = 5;     // 已过期
}

// 订单简要信息（用于订阅历史列表展示）
message OrderBriefInfo {
  string order_id = 1;               // 订单ID（orders.id）
  string order_number = 2;           // 订单号（orders.order_number）
  OrderType order_type = 3;          // 订单类型（新订阅/续费）
  int64 amount = 4;                  // 金额（单位：分，如 19900 表示 $199.00）
  string currency = 5;               // 币种代码（ISO 4217，如 "USD"、"CNY"）
  com.mineplanet.pojo.group.PayCycleUnit pay_cycle = 6;  // 付费周期（月/季/半年/年，保留在group_base）
  string payment_display = 7;        // 支付展示文本（多语言Key: svc_order_payment_display）
  int64 created_at = 9;              // 创建时间戳（秒级 UTC）
  int64 paid_at = 10;                // 支付完成时间戳（秒级 UTC，已支付订单必定有值）
}

// 接口用途：查询用户在指定圈子的已支付订单简要信息列表（仅返回 paid 状态）
message GetGroupOrdersRequest {
  enum Type {
    none = 0;
    max = 4000;
    min = 4231;  // 协议编号
  }
  string group_id = 1;               // 必填，圈子ID
  string user_id = 2;                // 必填，用户ID（不传则使用当前登录用户）
  OrderType order_type = 3;          // 非必填，筛选订单类型
  int32 page = 4;                    // 非必填，页码（默认 1）
  int32 page_size = 5;               // 非必填，每页大小（默认 20，最大 100）
}

// 接口用途：返回用户在指定圈子的已支付订单简要信息列表
message GetGroupOrdersResponse {
  enum Type {
    none = 0;
    max = 4000;
    min = 4232;  // 协议编号
  }
  com.mineplanet.pojo.pb.Result result = 1;  // 标准结果
  repeated OrderBriefInfo orders = 2;        // 订单简要信息列表（仅已支付）
  int32 total = 3;                             // 总记录数
  int32 page = 4;                              // 当前页码
  int32 page_size = 5;                         // 每页大小
