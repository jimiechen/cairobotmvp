syntax = "proto3";
option objc_class_prefix = "PROTO";
package com.mineplanet.pojo.third;

option java_package = "com.mineplanet.pojo.third";
option java_outer_classname = "ThirdProto";
option go_package = "github.com/jimiechen/mineplanet/protocols/generated/go/proto/base";
option optimize_for = LITE_RUNTIME;

import "base/result.proto";
import "base/group_base.proto";

// 直传凭证
message DirectUploadCredentials {
  string access_key_id = 1;     // AK
  string access_key_secret = 2; // SK
  string security_token = 3;    // STS Token（可选）
  string endpoint = 4;          // OSS Endpoint
  string bucket = 5;            // Bucket
  int64 expiration = 6;         // 过期时间戳（秒）
}

// 接口用途：获取直传配置（OSS STS 与上传前缀）
message GetDirectUploadConfigRequest {
  //Type枚举递增
  enum Type {
    none = 0;
    max = 4000;
    min = 4011;
  }
  // 上传类型（用户头像/圈子封面/主题多媒体/其他）
  enum UploadType {
    upload_type_unknown = 0;
    user_avatar = 1;
    group_cover = 2;
    topic_media = 3;
    other = 4;
  }
  UploadType upload_type = 1;  // 非必填，上传类型
}

// OSS 回调变量配置
message OssCallbackVars {
  string user_id = 1;    // 用户ID，如 "12345"
  string biz_type = 2;   // 业务类型，如 "user-avatar"
}

// OSS 回调配置
message OssCallbackConfig {
  string url = 1;                  // 回调地址，如 https://your-server.com/api/oss/callback
  string body = 2;                 // 回调请求体模板
  string content_type = 3;         // Content-Type，如 application/x-www-form-urlencoded
  OssCallbackVars callback_vars = 4;  // 回调变量配置
}

// 接口用途：返回直传配置（凭证与推荐前缀）
message GetDirectUploadConfigResponse {
  //Type枚举递增
  enum Type {
    none = 0;
    max = 4000;
    min = 4012;
  }
  com.mineplanet.pojo.pb.Result result = 1; // 通用结果
  DirectUploadCredentials credentials = 2;  // 直传凭证
  string upload_prefix = 3;                  // 推荐上传前缀：类型/年/月/日/UID/
  OssCallbackConfig oss_callback = 4;        // OSS 回调配置
}

