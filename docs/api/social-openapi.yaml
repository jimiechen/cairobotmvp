openapi: 3.0.3
info:
  title: CaiRobot Social Domain API
  version: 1.0.0
  description: >
    CaiRobot MVP 社交域协议文档（Proto-First 版本）。

    ## 架构约束

    所有业务请求统一通过 `POST /api/hello` 进入，
    使用 `MessagePacket.maxType` 区分成员(1000)/群组(2000)/主题(3000)协议组，
    使用 `MessagePacket.minType` 区分具体业务动作（**奇数=Request，偶数=Response**），
    payload 为对应 Protobuf Request 序列化后的 bytes。

    **Proto-First**: 所有 minType 编号以 proto/social/*.proto 文件中的实际定义为准，
    不再使用理想化的连续编号。本文档与 Protobuf 定义保持严格一致。

    **重要**: 本文档不描述任何绕过网关的业务 REST 接口。
    所有社交域能力均通过 MessagePacket 统一入口访问。

servers:
  - url: http://localhost:8080
    description: Gateway 本地开发环境

paths:
  /api/hello:
    post:
      summary: CaiRobot Social Domain Unified Gateway
      description: >
        社交域所有业务请求的统一入口。
        请求体为 MessagePacket Protobuf 二进制（application/x-protobuf），
        其中 maxType/minType 标识具体协议（奇数minType=Request，偶数minType=Response），
        data 字段为对应 Request message 序列化后的 bytes。
        响应同样为 MessagePacket 格式。
      operationId: callSocialMessagePacket
      tags:
        - Gateway
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
              example: "<MessagePacket binary data>"
      responses:
        "200":
          description: MessagePacket response（Protobuf 二进制）
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
        "400":
          description: 请求参数错误
        "401":
          description: 未认证
        "403":
          description: 无权限
        "500":
          description: 服务器内部错误

x-cairobot-protocol-groups:
  - maxType: 1000
    name: MemberProtocolGroup
    description: >
      成员协议组。负责用户注册、登录、登出、令牌刷新、资料管理、拉黑、用户统计。
      对应 Proto 文件: proto/social/member.proto
      对应 Tars Server: MemberServer / MemberObj
      **Proto-First**: minType 编号以 member.proto 中 message 定义为准
      编号规则: 奇数 minType=C->S Request, 偶数 minType=S->C Response
  - maxType: 2000
    name: GroupProtocolGroup
    description: >
      群组协议组。负责群组 CRUD、入群退群、成员管理（禁言/封禁/移除/角色）、续期、权限、折扣、支付计算。
      对应 Proto 文件: proto/social/group.proto
      对应 Tars Server: GroupServer / GroupObj
      **Proto-First**: minType 编号以 group.proto 中 message 定义为准
      编号规则: 奇数 minType=C->S Request, 偶数 minType=S->C Response
  - maxType: 3000
    name: TopicProtocolGroup
    description: >
      主题协议组。负责帖子发布与管理、列表查询、置顶、回复、搜索、点赞收藏、举报、操作检查。
      对应 Proto 文件: proto/social/topic.proto
      对应 Tars Server: TopicServer / TopicObj
      **Proto-First**: minType 编号以 topic.proto 中 message 定义为准
      编号规则: 奇数 minType=C->S Request, 偶数 minType=S->C Response

x-cairobot-protocols:

  # ============================================================
  # 成员协议组 (maxType = 1000)
  # 奇数 minType = C->S Request, 偶数 minType = S->C Response
  # ============================================================

  - name: MemberRegister
